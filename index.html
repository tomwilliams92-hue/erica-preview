ll also carry out a patch test.",pricePence:null,phrasings:["What happens at the consultation?","what is a consultation","what do you do at a consultation","What should I expect at my first visit?","wat happens at my consult","what does the consultation involve","consultation what to expect"],on:!0},{key:"consult-questionnaire",kind:"faq",clinic:null,treatment:null,title:"Medical questionnaire",answer:"Yes. All clients complete a medical questionnaire prior to treatment. We ask you to provide accurate, complete and up-to-date medical information, including any medications, allergies, medical conditions, pregnancy status or changes to health.",pricePence:null,phrasings:["Is there a medical form to fill in?","medical questionnaire","do i need to tell you about my medical history","What medical information do you need from me?","is there a form i hav to fill out","Do you ask health questions before treatment?","Will I need to complete any forms?"],on:!0},{key:"consult-guarantee",kind:"faq",clinic:null,treatment:null,title:"Whether a patch test rules out a reaction",answer:"A patch test is performed to assess skin suitability, identify potential sensitivities and support the safe delivery of treatment. However, a patch test does not guarantee that adverse reactions will not occur.",pricePence:null,phrasings:["Does a patch test mean I won't react?","patch test guarantee","what is the patch test for","if my patch test is fine will the treatment be fine","Why do you do a patch test?","can i still react after a patch test","wats the point of the patch test"],on:!0},{key:"pay-course-hair-removal",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Paying per session or for a course",answer:"You can pay per treatment or pay upfront for a course. On all our courses your 6th session is free.",pricePence:null,phrasings:["Do I have to buy a course of hair removal?","can i pay per session for laser hair removal","pay as you go laser?","how does the hair removal course work","is the 6th session free on a hair removal course","do u have to pay for all the hair removal sessions upfront"],on:!0},{key:"pay-course-tattoo-removal",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"How tattoo removal is priced",answer:"Prices are per tattoo, either per session or as a course of 6 paid upfront, with your 6th session free. Your tattoo is measured at your free consultation, and prices vary by clinic.",pricePence:null,phrasings:["Is tattoo removal priced per session or per course?","do i pay per tattoo","tattoo removal course","can i pay for one tattoo removal session at a time","is tattoo removal the same price at all your clinics","tatoo removal is the 6th session free?","How is tattoo removal priced?","how do you measure the tattoo for the price","priced by size","i have a few tattoos can you price them together","how do i know what size my tattoo counts as","do you charge by the size of the tatoo"],on:!0},{key:"pay-finance-available",kind:"faq",clinic:null,treatment:null,title:"0% finance",answer:"Yes, we offer 0% finance directly through our lending partner Buyline. It is available at all our clinics on all our treatments valued over \xA3250.",pricePence:null,phrasings:["Do you do finance?","0% finance","can I spread the cost","is there a minimum spend for finance","who is the finance with","do u do payment plans","can i pay monthly for my treatment"],on:!0},{key:"pay-finance-how-it-works",kind:"faq",clinic:null,treatment:null,title:"How 0% finance works",answer:"You can choose a 9, 10 or 11-month repayment plan, with no interest applied. Following approval, a 10% deposit of the total cost is required at your first treatment appointment, and the remaining finance balance is payable directly through Buyline.",pricePence:null,phrasings:["How does the finance work?","how many months is the finance over","is there interest on the finance","finance deposit","do i pay anything upfront on finance","how dose the 0% finance work","what are the repayment terms"],on:!0},{key:"pay-finance-apply",kind:"faq",clinic:null,treatment:null,title:"Applying for 0% finance",answer:"Finance is subject to application, and depends on your own personal financial circumstances and borrowing history. To enquire and get a more detailed quote, please use our 0% Finance Enquiry Form.",pricePence:null,phrasings:["How do I apply for finance?","apply for finance","will I get accepted for finance","does the finance depend on my borrowing history","how do i get a finance quote","wher do i apply for the 0% finance","can anyone get finance"],on:!0},{key:"pay-deposit-amount",kind:"faq",clinic:null,treatment:null,title:"Holding deposit",answer:"A holding deposit of \xA320, \xA340 or \xA350, depending on the treatment duration, is required following your consultation and patch test if you wish to proceed with booking treatment.",pricePence:null,phrasings:["How much is the deposit?","do I need to pay a deposit","deposit","when do i pay the deposit","is there a booking fee","how much deposite to book in","do you take a deposit after the consultation"],on:!0},{key:"pay-deposit-refund",kind:"faq",clinic:null,treatment:null,title:"Getting your deposit back",answer:"Your deposit is held on your account and refunded at the completion of your treatment course, provided no appointments have been missed without notice and none cancelled or changed with less than 48 hours\u2019 notice. If a deposit is forfeited, a new holding deposit is required before any further appointments can be booked.",pricePence:null,phrasings:["Do I get my deposit back?","is the deposit refundable","deposit back","when is my deposit returned","what happens to my deposit at the end of my course","will i loose my deposit","do I have to pay another deposit if I lose mine"],on:!0},{key:"pay-when-due",kind:"faq",clinic:null,treatment:null,title:"When payment is due",answer:"Full payment is required at the time of treatment unless otherwise agreed.",pricePence:null,phrasings:["When do I pay?","do I pay on the day","do i have to pay before my appointment","when is payment taken","pay on the day?","do u pay at the appointment or before"],on:!0},{key:"pay-price-changes",kind:"faq",clinic:null,treatment:null,title:"Price changes after buying a course",answer:"Prices are subject to change without prior notice. Prepaid treatments and packages you have already purchased will be honoured at the agreed purchase price.",pricePence:null,phrasings:["Will my course price go up?","price increase","if prices go up do i pay more for my course","are prices fixed once I've paid","do your prices change","will i be charged extra if the price changes after ive paid","is my package price locked in"],on:!0},{key:"pay-course-sharing",kind:"faq",clinic:null,treatment:null,title:"Sharing or transferring a course",answer:"Treatment packages cannot be shared between individuals. They are non-transferable unless otherwise agreed in writing by management.",pricePence:null,phrasings:["Can I share my course with a friend?","transfer my course","can i give my sessions to someone else","can my partner use my remaining sessions","can two people split a package","can i transfer my sesions to my sister","is a course transferable"],on:!0},{key:"pay-course-validity",kind:"faq",clinic:null,treatment:null,title:"How long a course is valid",answer:"Packages must be used within the validity period advised at the time of purchase.",pricePence:null,phrasings:["How long is my course valid for?","course validity","is there a time limit to use my sessions","how long do i have to use my package","how long have i got to use up my course","wen does my course run out"],on:!0},{key:"pay-voucher-rules",kind:"faq",clinic:null,treatment:null,title:"Gift voucher rules",answer:"Gift vouchers are non-refundable and cannot be exchanged for cash. They must be redeemed before the expiry date and cannot be replaced if lost, stolen or damaged.",pricePence:null,phrasings:["Do gift vouchers expire?","can I get cash for my voucher","lost my gift voucher","can i get a refund on a gift voucher","voucher rules","ive lost my voucher can i get another one","can I swap my voucher for money"],on:!0},{key:"pay-price-list-where",kind:"faq",clinic:null,treatment:null,title:"Where to find the price list",answer:"Each clinic has its own price list, so please refer to the individual clinic price lists for treatment costs.",pricePence:null,phrasings:["Where is your price list?","price list","can you send me your prices","do you have a price list i can look at","wheres the price list","where can i see all your prices","is there a price menu"],on:!0},{key:"pay-prices-by-clinic-hair-removal",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Prices at different clinics",answer:"Our laser hair removal prices are the same at all clinics except London, which has separate prices.",pricePence:null,phrasings:["Are hair removal prices the same at all clinics?","london prices","are London hair removal prices different","do all your clinics charge the same for laser hair removal","is hair removal the same price in leeds as manchester","are the prices diffrent in london","does the London clinic have its own prices"],on:!0},{key:"policy-cancel-notice",kind:"faq",clinic:null,treatment:null,title:"Cancelling or moving an appointment",answer:"We require a minimum of 48 hours\u2019 notice to cancel or reschedule an appointment.",pricePence:null,phrasings:["How much notice do I need to cancel?","cancellation policy","what's your cancellation policy","can I move my appointment","how late can i reschedule","wats the notice period for cancelling","how many hours notice to rearrange my appointment","reschedule appointment","how much notice to change my booking","i need to rearrange my appt","Can I change the date of my appointment?","need to swap my appointment to another day"],on:!0},{key:"policy-late-cancellation",kind:"faq",clinic:null,treatment:null,title:"Late cancellations",answer:"Appointments cancelled with less than 48 hours\u2019 notice may result in loss of your deposit, deduction of a treatment session from a prepaid package, or a cancellation fee.",pricePence:null,phrasings:["What if I cancel last minute?","late cancellation","will I lose my deposit if I cancel the day before","is there a cancellation fee","do i lose a session if i cancel late","wat happens if i cancel on the day","will I be charged for cancelling at short notice"],on:!0},{key:"policy-missed-appointment",kind:"faq",clinic:null,treatment:null,title:"Missed appointments",answer:"If you miss an appointment without notice, the full appointment fee or treatment session may be forfeited. Repeated late cancellations or missed appointments may result in refusal of future bookings.",pricePence:null,phrasings:["What if I miss my appointment?","no show","missed appointment","do you charge for no shows","what hapens if i dont turn up","will I lose a session if I don't attend","what if I forget my appointment"],on:!0},{key:"policy-refunds",kind:"team",clinic:null,treatment:null,title:"Refunds",answer:"Refunds are not provided for completed treatments, partially used packages, change of mind, dissatisfaction where treatments have been carried out correctly, or failure to follow aftercare instructions. Refund requests are considered solely at the discretion of LaserHQ management.",pricePence:null,phrasings:["Can I get a refund?","refund policy","can I get my money back for unused sessions","i've changed my mind can i have a refund","do you refund courses","can i get a refund on my packge","I want my money back"],on:!0},{key:"policy-unused-sessions",kind:"faq",clinic:null,treatment:null,title:"Unused sessions after a course expires",answer:"Unused sessions remaining after the expiry date may be forfeited.",pricePence:null,phrasings:["What happens to unused sessions?","do I lose sessions I haven't used","expired course","my package has expired but i still have sessions left","will i loose my sessions if my course expires","can I still use sessions after the expiry date"],on:!0},{key:"policy-minimum-age",kind:"faq",clinic:null,treatment:null,title:"Minimum age",answer:"Clients must be aged 18 years or over to consent to treatment, unless otherwise permitted by law and accompanied by a parent or legal guardian where appropriate.",pricePence:null,phrasings:["How old do you have to be?","minimum age","can under 18s have laser","do you treat teenagers","is ther an age limit","can my daughter have treatment if I come with her","what age can you start laser","im 17 can i have laser hair removal","can my 16 year old daughter have laser","do you treat under 18s","wats the age limit for laser","do I need ID to prove my age"],on:!0},{key:"policy-proof-of-age",kind:"faq",clinic:null,treatment:null,title:"Proof of age",answer:"We may ask for photographic identification as proof of age.",pricePence:null,phrasings:["Do I need to bring ID?","proof of age","will you ask for ID","do i need my passport or driving licence","do u check id","should I bring photo ID to my appointment","Do I need ID?","photo id","Do you check ID?","do u need proof of age","Should I bring identification?"],on:!0},{key:"policy-complaints",kind:"team",clinic:null,treatment:null,title:"Making a complaint",answer:"Please raise any concerns or complaints with the clinic or via Customer Care as soon as possible, so that we can investigate and attempt to resolve the matter promptly and fairly.",pricePence:null,phrasings:["How do I make a complaint?","complaint","I want to complain","who do I speak to about a problem with my treatment","i'm not happy with my treatment","how do i complane","I'd like to speak to a manager"],on:!0},{key:"policy-photographs",kind:"faq",clinic:null,treatment:null,title:"Photographs and clinical records",answer:"Clinical photographs may be taken before, during and after treatment for medical records, treatment monitoring, insurance purposes and clinical assessment. They will never be used for marketing, advertising, training or social media purposes without your separate written consent.",pricePence:null,phrasings:["Do you take photos?","before and after photos","will my photos be put on social media","what do you do with my pictures","do u post client photos on instagram","why do you take pictures of the treatment area","can I say no to my photos being used for marketing"],on:!0},{key:"policy-data-protection",kind:"faq",clinic:null,treatment:null,title:"Data protection",answer:"We handle all data in accordance with the UK General Data Protection Regulation (UK GDPR) and the Data Protection Act 2018, and we are registered with the Information Commissioner\u2019s Office (ICO). We collect, store and process personal information only where necessary for legitimate business, treatment, medical, booking and customer service purposes.",pricePence:null,phrasings:["How is my data handled?","data protection","gdpr","are you GDPR compliant","what do you do with my personal details","why do you need my personal information","are u registered with the ICO"],on:!0},{key:"offer-black-friday",kind:"team",clinic:null,treatment:null,title:"Black Friday sale",answer:"Our Black Friday sale runs from 15 November 2026 to 6 December 2026, with offers on selected laser treatments. Sale prices only apply to purchases made in that time. Black Friday courses can be redeemed at all LaserHQ clinics, except CO\u2082, Baby CO\u2082 and eyeliner SPMU removal, which are only available at our Manchester (Whitefield) clinic.",pricePence:null,phrasings:["Any offers on at the moment?","black friday deals","do you have a Black Friday sale","when does the black friday sale end","have you got any deals on","any discounts atm","can I use a Black Friday course at any clinic"],on:!0},{key:"offer-black-friday-rules",kind:"team",clinic:null,treatment:null,title:"Black Friday course rules",answer:"Black Friday courses do not expire and can remain on your client file for futu  get to the leeds clinic","wheres best to park for the leeds one","How do I find you on Norville Terrace?","Is the Leeds clinic far from the city centre?"],on:!0},{key:"clinics-london-getting-there",kind:"faq",clinic:"London",treatment:null,title:"Getting there and parking",answer:"The nearest station is Knightsbridge (Piccadilly Line), just a short walk from Harvey Nichols, and several bus routes stop nearby on Knightsbridge and Sloane Street. Parking in Knightsbridge is limited, so we recommend planning ahead. Nearby car parks include Knightsbridge Car Park, Cadogan Place Car Park and Q-Park Knightsbridge.",pricePence:null,phrasings:["Is there parking near the London clinic?","parking in Knightsbridge","how do i get to the london clinic","wat tube is nearest to u in london","Which bus goes to the Harvey Nichols clinic?","Are there car parks near the London clinic?"],on:!0},{key:"clinics-manchester-treatments",kind:"faq",clinic:"Manchester",treatment:null,title:"Treatments at this clinic",answer:"At our Manchester clinic we offer laser hair removal, laser tattoo removal (we can also remove SPMU eyebrow and eyeliner ink), pigmentation removal, CO\u2082 fractional laser, fungal nail laser treatment, thread vein removal and cherry angioma removal.",pricePence:null,phrasings:["What treatments do you do in Manchester?","Manchester treatments","wat do u offer at the manchester clinic","Which services are available at the Whitefield clinic?","What can I have done at your Manchester clinic?","Does the Manchester clinic do more than hair removal?"],on:!0},{key:"clinics-liverpool-treatments",kind:"faq",clinic:"Liverpool",treatment:null,title:"Treatments at this clinic",answer:"Treatments at our Liverpool clinic include laser hair removal, laser tattoo removal, Sunerase treatment, pigmentation removal, carbon laser facials, fungal nail laser treatment, Primelase blood spot treatment for cherry angiomas and thread vein removal.",pricePence:null,phrasings:["What treatments do y ic do more than hair removal?"],on:!0},{key:"clinics-liverpool-harvey-nichols",kind:"faq",clinic:"Liverpool",treatment:null,title:"No longer in Liverpool Harvey Nichols",answer:"The Harvey Nichols Beauty Bazaar closed its doors in April 2025, so all the concessions there had to close down, including ours. We are delighted with our new premises in the Smileworks Hub.",pricePence:null,phrasings:["Are you still in Liverpool Harvey Nichols?","Harvey Nichols Liverpool","r u still in the beauty bazaar","Have you moved from Harvey Nichols in Liverpool?","I used to come to you at the Beauty Bazaar, where are you now?","Did the Liverpool Harvey Nichols clinic close?"],on:!0},{key:"clinics-cities",kind:"faq",clinic:null,treatment:null,title:"Where our clinics are",answer:"We have five clinics: Manchester, Liverpool, Leeds, Newcastle and London (within Harvey Nichols, Knightsbridge).",pricePence:null,phrasings:["Which cities are you in?","your locations","how many clinics have u got","What locations do you have?","Do you have more than one clinic?","Which towns do you have branches in?"],on:!0},{key:"clinics-email",kind:"faq",clinic:null,treatment:null,title:"Email address and contact form",answer:"You can email your nearest clinic at manchester@laserhq.co.uk, liverpool@laserhq.co.uk, leeds@laserhq.co.uk, newcastle@laserhq.co.uk or london@laserhq.co.uk. You can also drop us a message through the contact form on our website and a member of our team will be in touch within 24 hours.",pricePence:null,phrasings:["What's your email address?","email address","can i email you","wats ur email","How do I get in touch with the clinic in writing?","Is there a contact form I can use?"],on:!0},{key:"clinics-founder",kind:"faq",clinic:null,treatment:null,title:"Who founded LaserHQ and when",answer:"LaserHQ was founded in 2017 by Helen Quayle, starting from a single salon room.",pricePence:null,phrasings:["Who founded LaserHQ?","who started laser hq","how long have you been going","wen did laserhq start","When was LaserHQ set up?","Who is the founder of the business?"],on:!0},{key:"clinics-staff-qualifications",kind:"faq",clinic:null,treatment:null,title:"Staff qualifications and training",answer:"Every member of the LaserHQ team is qualified to at least VTCT Level 3, Level 4, or Level 5 standards. All staff complete a robust in-house training programme from day one, with ongoing professional development through regular training sessions and in-clinic spot checks.",pricePence:null,phrasings:["Are your therapists qualified?","staff qualifications","r ur laser technicians trained properly","What training do your staff have?","Is the person doing my treatment qualified?","What level are your laser therapists qualified to?"],on:!0},{key:"clinics-lgbtq-welcome",kind:"faq",clinic:null,treatment:null,title:"LGBTQ+ and transgender clients",answer:"Yes. At LaserHQ we believe in providing a safe and inclusive environment for all of our clients, and we are proud to offer a range of services tailored to the specific needs of the LGBTQ+ community. All our staff are fully trained on how to interact with our LGBTQ+ clients, and how to recognise and support their needs in a respectful and understanding manner.",pricePence:null,phrasings:["Are you LGBTQ+ friendly?","trans friendly?","do you treat transgender clients","im trans, will i be made to feel welcome","Is your clinic inclusive?","Do you welcome gay and non-binary clients?"],on:!0},{key:"hair-how-it-works",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"How laser hair removal works",answer:"During treatment, specific wavelengths of laser light are absorbed by melanin, the dark pigment which surrounds the hair follicle. The laser targets the follicle to slow regrowth, leaving your skin smooth and soft. It can only treat hairs that are in the growing phase or visible on the skin surface, so multiple treatments are required to treat all hair in the skin.",pricePence:null,phrasings:["How does laser hair removal work?","how does the laser actually get rid of the hair","what does the laser do to the hair","how it works","hw does laser work on hair","why do I need more than one session"],on:!0},{key:"hair-machine-used",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Which laser machine we use",answer:"Every laser hair removal treatment we perform uses the medical-grade Primelase Excellence, a diode laser, with the Blend handpiece.",pricePence:null,phrasings:["What machine do you use?","which laser do you use for hair removal","is it a diode laser","is it laser or IPL","what machne is it","do you use Primelase","laser machine"],on:!0},{key:"hair-blend-technology",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"What Blend is",answer:"Blend is the technology on our Primelase Excellence, and all our clinics use it. It uses three different wavelengths: 810nm, 940nm and 1060nm.",pricePence:null,phrasings:["What is Blend?","what is blend innovation","what wavelengths does your laser use","Blend handpiece","do all your clinics have the blend laser","whats the blend thing on your machine"],on:!0},{key:"hair-skin-types",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Skin types and tones",answer:"Yes. Our Primelase Excellence uses Blend technology, which combines three different wavelengths, so we can safely treat every skin type. A patch test and consultation is required first.",pricePence:null,phrasings:["Does it work on dark skin?","do you treat all skin tones","is it safe for black skin","darker skin","can you laser asian skin","dose it work on all skin types"],on:!0},{key:"hair-light-hair-colours",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Blonde, red, grey or white hair",answer:"Laser targets the pigment in the hair, so very light hair responds less well, and red and grey hair cannot be treated as successfully. Some lighter hair clients do receive results but it can be a longer process. We can test your hair at your consultation and patch test and say if the treatment will be right for you.",pricePence:null,phrasings:["Does it work on blonde hair?","can you laser grey hair","will it work on ginger hair","white hairs","does laser work on light hair","dose it work on red or blond hair"],on:!0},{key:"hair-session-length",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"How long a session takes",answer:"Depending on the size of the treatment area, a session can take anywhere from a few minutes to an hour.",pricePence:null,phrasings:["How long does a session take?","how long is each appointment","how long will i be in for","session length","how much time should I allow for my treatment","is it quick or will i be there ages"],on:!0},{key:"hair-when-results-show",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"When results show",answer:"Most people notice less hair, and finer regrowth, after 2 to 3 sessions. Hair sheds in the 1 to 3 weeks after each session.",pricePence:null,phrasings:["When will I see results?","how soon does the hair fall out","how long until it starts working","when does the hair shed after laser","results","wen will i notice a difference"],on:!0},{key:"hair-how-long-results-last",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"How long results last and top-up sessions",answer:"The treatment provides long-term hair reduction. Most clients enjoy smooth skin for years with occasional top-up sessions.",pricePence:null,phrasings:["Is it permanent?","does the hair grow back","how long do results last","will i need top ups","is it forever","do you need maintenance sessions after the course","top up sessions"],on:!0},{key:"hair-does-it-hurt",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Does it hurt, and cooling",answer:"Most people describe a warm prickling sensation during treatments and say it's easier than waxing. Our machines have built-in cooling technology to make the treatments comfortable.",pricePence:null,phrasings:["Does it hurt?","is laser hair removal painful","what does it feel like","does the machine have cooling","is it worse than waxing","dose it hurt alot","pain"],on:!0},{key:"hair-numbing-cream",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Numbing cream",answer:"Yes. We can use numbing creams and cool air jets to help with any pain.",pricePence:null,phrasings:["Can I use numbing cream?","do you offer anything to numb the area","numbing cream","can i put emla on before my laser","is there anything for the pain","can u numb it first"],on:!0},{key:"hair-areas-treated",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Body areas we treat",answer:"We offer laser hair removal on the face, neck, underarms, arms, chest, stomach, back, bikini area, buttocks, legs, hands and feet. We also offer a full body treatment.",pricePence:null,phrasings:["What areas can you treat?","which body parts do you do","do you do legs and underarms","can you do full body","areas","wat areas do u laser"],on:!0},{key:"hair-face-areas",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Facial hair removal",answer:"Yes, we treat facial hair. Our face treatments include full face, half face, top lip and chin, side burns and hairline, and we also treat the neck.",pricePence:null,phrasings:["Do you do facial hair?","can I have my upper lip and chin lasered","face laser hair removal","do you treat the face","can u do my tash","do you do sideburns or the hairline"],on:!0},{key:"hair-intimate-areas",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Intimate areas",answer:"Yes. Our intimate treatments include Bikini, Brazilian, Hollywood, Hollywood F&B and Peri Anal (Intimate Back).",pricePence:null,phrasings:["Do you do intimate areas?","can I get a Hollywood","do you do brazilian laser","bikini line","do you laser down there","is intimate laser hair removal available"],on:!0},{key:"hair-men",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Laser hair removal for men",answer:"Yes. Plenty of male clients have treatment at our clinics, and we can target numerous facial and body areas. For men, the most common areas are the back and shoulders, the jawline, beard line and neck, the buttocks and the chest.",pricePence:null,phrasings:["Do you treat men?","is laser hair removal for men too","do you do mens back and shoulders","male laser hair removal","do u do blokes","what areas do men usually get done"],on:!0},{key:"hair-beard-and-scalp",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Beard shaping and scalp",answer:"Yes. Beard shaping, full scalp and half scalp are all laser hair removal treatments we offer.",pricePence:null,phrasings:["Do you do beard shaping?","can you laser my beard line","do you do scalp hair removal","can I have my head lasered","beard laser","can u tidy my beard up with laser"],on:!0},{key:"hair-pcos-hormonal-hair",kind:"team",clinic:null,treatment:"Laser hair removal",title:"PCOS and hormonal hair growth",answer:"Yes. We treat a great many clients with hormonal imbalances such as PMOS, formerly known as PCOS, and our whole team is trained in hormone health. Hormone related hair can sometimes require more sessions.",pricePence:null,phrasings:["I have PCOS, can laser help?","do you treat hormonal hair","does laser work with pcos","PCOS facial hair","i hav polycystic ovaries will it work","can you help with hair from a hormone imbalance","PMOS hair removal"],on:!0},{key:"hair-hirsutism",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Hirsutism",answer:"Yes, we offer laser hair removal for hirsutism as a long-term solution to managing excessive hair growth. Because hirsutism is hormonally driven, laser hair removal manages the condition rather than curing it.",pricePence:null,phrasings:["Do you treat hirsutism?","can laser help with hirsutism","excessive hair growth in women","hirsutism","i have hirsuitism can you help","will laser cure hirsutism"],on:!0},{key:"hair-ingrown-hairs",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Ingrown hairs",answer:"Laser hair removal can help with ingrown hairs. While it can't guarantee you'll never have another ingrown hair, it can greatly reduce their frequency and severity.",pricePence:null,phrasings:["Does laser help with ingrown hairs?","I get loads of ingrowns, will laser stop them","ingrown hairs","can laser get rid of ingrown hairs","will it help my ingrowing hairs","is laser good for ingrown hairs on the bikini line"],on:!0},{key:"hair-folliculitis",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Folliculitis",answer:"We might be able to help with folliculitis through laser hair removal. We suggest you ask your doctor if they think laser hair removal could help you with your folliculitis.",pricePence:null,phrasings:["Can laser help with folliculitis?","I get folliculitis, is laser any good for it","folliculitis","do you treat infected hair follicles","will laser sort out my foliculitis","does laser hair removal stop folliculitis"],on:!0},{key:"hair-strawberry-legs",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Strawberry legs",answer:"Laser hair removal treats strawberry legs at the source rather than masking the symptoms, and most clients see a progressive improvement over their course of treatments. At your consultation we'll look at what's causing your strawberry legs and put together a plan that works for your skin.",pricePence:null,phrasings:["Does laser help strawberry legs?","can you get rid of the dark dots on my legs","strawberry legs","will laser fix strawberry skin","i have strawbery legs can laser help","do you treat strawberry legs"],on:!0},{key:"hair-keratosis-pilaris",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Keratosis pilaris",answer:"Laser hair removal can help with keratosis pilaris. It cannot change your genetics, but it removes the hair trapped beneath the plug, and it is best viewed as a long-term management treatment rather than a cure.",pricePence:null,phrasings:["Does laser help keratosis pilaris?","can laser get rid of chicken skin","keratosis pilaris","I have KP on my arms, would laser help","will laser help the bumps from keritosis pilaris","do you treat KP"],on:!0},{key:"hair-versus-shaving-waxing",kind:"faq",clinic:null,treatment:"Laser hair removal",title:"Laser compared with shaving or waxing",answer:"Shaving and waxing simply remove the hair temporarily and can cause further irritation, whereas laser hair removal works at the root.",pricePence:null,phrasings:["Is laser better than waxing?","why laser instead of shaving","laser vs waxing","whats the difference between laser and waxing","is it worth it over just shaving","how is laser different to waxing or shaving"],on:!0},{key:"before-shaving",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Shaving before a session",answer:"Yes, please shave the area before your session, as the laser needs shaven follicles for it to work properly. Please don't shave immediately before, as it can cause cuts and irritation that should be allowed to heal. We usually say about 24 hours before your visit is perfect.",pricePence:null,phrasings:["Do I need to shave before laser?","should i shave before my appointment","shave before laser","when shud i shave before my session","do I shave the night before or on the day of my laser","should I let the hair grow out before my laser session","how long does the hair need to be for laser"],on:!0},{key:"before-waxing-threading-epilating",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Waxing, threading or epilating before starting",answer:"Waxing, threading, epilating and depilatory creams all remove the root, leaving the laser with nothing to target. These methods must be stopped at least 4 weeks before your first session and avoided entirely throughout your treatment course.",pricePence:null,phrasings:["Can I wax before laser?","do i need to stop waxing before my first session","waxing before laser","is threading ok before I start laser hair removal","how long after a wax can I start laser","can i use my epilator or hair removal cream before my first appointment","wen do i need to stop waxing b4 laser"],on:!0},{key:"before-fake-tan",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Fake tan before a session",answer:"Please refrain from applying any false tan for at least 7 days before your treatment, and make sure any tan residue is completely removed from your skin before treatment.",pricePence:null,phrasings:["Can I fake tan before laser?","fake tan before laser","how long before my session do i need to stop fake tanning","can i get a spray tan before my appointment","do i need to scrub my tan off before laser","false tan b4 laser??"],on:!0},{key:"before-fake-tan-still-visible",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Arriving with fake tan still on",answer:"If false tan is visible, our therapists will be unable to perform the treatment at that time, and you will be charged 50% of your treatment cost.",pricePence:null,phrasings:["What if I've still got fake tan on?","will you still treat me with fake tan on","tan still on","i forgot and put fake tan on can i still come in","do you charge if you cant treat me because of my tan","my fake tan hasnt fully come off is that ok"],on:!0},{key:"before-retinol-and-acids",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Retinol, acids and active skincare before a session",answer:"Skincare containing retinol, retinoids, AHAs or BHAs should usually be paused for 2 to 4 weeks before each session, depending on its strength. Your therapist can advise.",pricePence:null,phrasings:["Do I need to stop retinol before laser?","can i use retinol before my session","retinol and laser","should I stop using acids or actives before treatment","how long before laser do i stop my glycolic acid","wat skincare do i need to stop b4 laser on my face"],on:!0},{key:"before-products-on-the-day",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Make-up, deodorant and lotions on the day",answer:"Please arrive with clean, product-free skin, with no moisturiser, deodorant, fake tan or SPF on the area being treated.",pricePence:null,phrasings:["Can I wear deodorant to my appointment?","can i wear makeup for my facial laser","deodorant before laser","should I moisturise before my session","do i need to come with no products on my skin","is it ok to have body lotion or suncream on on the day"],on:!0},{key:"before-what-to-wear",kind:"team",clinic:null,treatment:"Laser hair removal",title:"What to wear to a session",answer:"Please wear loose, comfortable clothing to your appointment, particularly if you are having legs, underarms or the bikini area treated.",pricePence:null,phrasings:["What should I wear to my appointment?","what to wear","do i need to wear loose clothes for laser","what do i wear for a bikini laser session","should I wear anything particular on the day","wat shud i wear to my laser appt"],on:!0},{key:"before-caffeine-alcohol-painkillers",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Caffeine, alcohol and painkillers before a session",answer:"Please avoid caffeine, alcohol, Aspirin and Ibuprofen for 24 hours beforehand, as these can increase sensitivity.",pricePence:null,phrasings:["Can I drink alcohol before laser?","can i have a coffee before my appointment","alcohol before laser","should I take ibuprofen before my session","is it ok to have a drink the night before laser","can i take painkillers b4 my laser"],on:!0},{key:"before-preparing-in-general",kind:"team",clinic:null,treatment:null,title:"Preparing for a session",answer:"Our team will give you clear guidance before, during and after your appointment. It is extremely important that you follow the pre-treatment care guidelines we give you, as they are designed to ensure your safety, optimise your results and minimise the risk of any adverse reactions or complications.",pricePence:null,phrasings:["How do I prepare for laser?","anything i need to do before my appointment","pre treatment advice","will you tell me how to get ready for my first session","wat do i need to do b4 my treatment","is there a list of dos and donts before laser"],on:!0},{key:"aftercare-how-skin-looks",kind:"team",clinic:null,treatment:"Laser hair removal",title:"How skin looks and feels afterwards",answer:"The area may look a little pink or feel warm afterwards, similar to mild sunburn.",pricePence:null,phrasings:["Will my skin be red after laser?","what does skin look like after laser hair removal","redness after laser","is it normal for the area to feel warm afterwards","will i look sunburnt after my session","wat will my skin be like after laser"],on:!0},{key:"aftercare-how-long-redness-lasts",kind:"team",clinic:null,treatment:"Laser hair removal",title:"How long redness lasts",answer:"The area may look a little pink or feel warm for a few hours, similar to mild sunburn.",pricePence:null,phrasings:["How long does the redness last?","how long will my skin be red for after laser","redness how long","when will the pinkness go down after my session","how many days does it take for skin to settle after laser","how long till the soreness goes after laser hair removal"],on:!0},{key:"aftercare-spf",kind:"team",clinic:null,treatment:"Laser hair removal",title:"SPF during a course",answer:"We recommend a high-factor sun cream, at least SPF50, throughout your course.",pricePence:null,phrasings:["What SPF should I use?","do i need suncream after laser","spf after laser","what factor sun cream do you recommend","should I wear sunscreen on the treated area","wat spf do i need between sessions"],on:!0},{key:"aftercare-heat-and-exercise",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Hot baths, saunas and the gym afterwards",answer:"Please avoid hot baths, saunas and the gym for 24\u201348 hours after your session.",pricePence:null,phrasings:["Can I go to the gym after laser?","can i have a hot bath after my session","gym after laser","how long do I need to avoid saunas after treatment","is it ok to work out the same day as my laser","wen can i go bk to the gym after laser"],on:!0},{key:"aftercare-swimming",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Swimming and hot tubs afterwards",answer:"We'd recommend you avoid swimming pools and hot tubs for a few days after treatment.",pricePence:null,phrasings:["Can I go swimming after laser?","swimming after laser","how long after my session can i swim","is a hot tub ok after laser hair removal","can i go in the pool the day after my treatment","wen can i swim again after laser"],on:!0},{key:"aftercare-shaving-between-sessions",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Shaving, waxing or plucking between sessions",answer:"Shaving is fine between sessions. Please don't wax, pluck or bleach at all if you're planning on having more laser treatment in the near future.",pricePence:null,phrasings:["Can I shave between sessions?","shaving between laser sessions","can i wax in between my laser appointments","is it ok to pluck the odd hair between treatments","can I bleach the hair while I'm having laser","can i shave inbetween sesions"],on:!0},{key:"aftercare-shedding",kind:"team",clinic:null,treatment:"Laser hair removal",title:"When the hairs fall out",answer:"Treated hairs shed in the 1 to 3 weeks after each session.",pricePence:null,phrasings:["When do the hairs fall out?","how long till the hair sheds after laser","hair shedding","my hairs havent fallen out yet is that normal","why is the hair still there after my laser session","wen does the hair drop out after laser"],on:!0},{key:"aftercare-exfoliating",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Exfoliating afterwards",answer:"Gently exfoliating the treated area with a soft washcloth or scrub can help remove the shedding hairs more quickly. Please avoid aggressive scrubbing, which can irritate the skin.",pricePence:null,phrasings:["Can I exfoliate after laser?","exfoliating after laser","should i scrub the area to help the hairs come out","is it ok to use a body scrub after my session","can i use an exfoliating mitt after laser hair removal","does exfoliating help the hair shed"],on:!0},{key:"aftercare-reaction-contact-clinic",kind:"team",clinic:null,treatment:null,title:"Skin stays red or sore, or a reaction afterwards",answer:"In the unlikely event of an adverse reaction, please notify the clinic as soon as possible. This allows our team to assess the situation promptly, provide appropriate aftercare advice and, where necessary, recommend further clinical support or review.",pricePence:null,phrasings:["My skin is still red, what should I do?","ive had a reaction to my laser","skin reaction","the area is still sore and red days later","i think ive got a burn or blister after my treatment","who do i contact if my skin reacts after laser"],on:!0},{key:"aftercare-fake-tan",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Fake tan after a session",answer:"Fake tan can be applied 24 hours after your treatment.",pricePence:null,phrasings:["When can I fake tan after laser?","fake tan after laser","how long after my session can i put tan on","can i get a spray tan the day after laser","is it ok to put false tan on straight after treatment","wen can i put my tan bk on after laser"],on:!0},{key:"suitability-pregnancy",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Pregnancy",answer:"Whilst you are pregnant, we would recommend that it is best to wait until 3 months post-pregnancy before having any treatments. This will allow time for your hormones to regulate so that you can get the best out of your treatments. It has also never been tested whether laser treatments are safe or unsafe during pregnancy.",pricePence:null,phrasings:["I'm pregnant, can I still have laser?","im pregnant can i still have laser","laser when pregnant","is laser hair removal safe during my pregnancy","ive just found out im expecting can i carry on with my sessions","how soon after having my baby can I have laser"],on:!0},{key:"suitability-medication",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Taking medication",answer:"At your consultation, we will always ask if you are taking any medication. If you are, we would always advise that you check with your GP first that you are safe for the treatment. Some medications can cause light sensitive reactions, and this treatment would be unsuitable for those.",pricePence:null,phrasings:["I'm on medication, can I have laser?","can i have laser if im on tablets","laser on medication","does my medication affect whether I can have laser hair removal","my medicine makes my skin sensitive to light can i still have laser","do I need to tell you what medication I take","im on photosensitive meds is laser ok for me"],on:!0},{key:"suitability-roaccutane",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Roaccutane (isotretinoin)",answer:"A minimum clearance period of 6 months after recent use of Roaccutane (isotretinoin) is usually required before laser treatment can begin. Your practitioner will review this at your consultation.",pricePence:null,phrasings:["Can I have it on Roaccutane?","can i have laser on roaccutane","roaccutane and laser","im taking isotretinoin for my acne can i have laser hair removal","how long after finishing accutane can I start laser","i came off roacutane a few months ago is laser ok for me"],on:!0},{key:"suitability-skin-conditions",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Eczema, psoriasis and other skin conditions",answer:"We would not recommend that you have laser treatment during a flare-up of your skin condition. If you have eczema, rosacea or psoriasis in the area being treated, please wait until it has calmed down before proceeding. If you have a known skin condition that is being treated medically, please talk with your doctor or skin specialist about your intention to get laser hair removal.",pricePence:null,phrasings:["I have eczema, can I have laser?","can i have laser with psoriasis","eczema and laser","ive got a skin condition is laser hair removal ok for me","my eczema is flaring up can i still come to my appointment","i have rosacea on my face can i have it lasered"],on:!0},{key:"suitability-darker-skin",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Darker skin tones",answer:"Yes, our Primelase Excellence uses Blend technology, which combines three different wavelengths, so we can safely treat every skin type. A patch test and consultation is required first.",pricePence:null,phrasings:["I have dark skin, is laser safe for me?","does laser work on my black skin","laser on dark skin","im asian with brown skin can i have laser hair removal","is it safe for my skin tone im mixed race","can you treat my skin type its very dark"],on:!0},{key:"suitability-light-hair",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Fair, grey, white or red hair",answer:"Laser targets the pigment in the hair, so very light hair responds less well, and as there is no or little pigment in red and grey hair, this cannot be treated as successfully. Some lighter hair clients do receive results but it can be a longer process. We can test your hair at your consultation and patch test and say if the treatment will be right for you.",pricePence:null,phrasings:["I have blonde hair, will laser work?","does laser work on my grey hair","laser on red hair","im a redhead will it work for me","my facial hairs have gone white can they be lasered","i have fair hair is there any point me having laser","ginger hair laser??"],on:!0},{key:"suitability-scars",kind:"team",clinic:null,treatment:"Laser hair removal",title:"Scars in the treatment area",answer:"Yes, as long as the scar is fully healed, which can take up to 3 months. Our therapists will be able to check this for you at your consultation.",pricePence:null,phrasings:["I have a scar there, can I still have laser?","can you laser over my scar","scar in the area","ive got a c section scar can i have my bikini line done","i had an operation recently can i have laser on that area","is it ok to laser over my surgery scar"],on:!0},{key:"tattoo-how-it-works",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"How laser tattoo removal works",answer:"Our medical-grade lasers fire ultra-short pulses of energy that break tattoo ink into tiny particles. Your body then clears them away naturally, so the tattoo fades gradually over the following weeks and months.",pricePence:null,phrasings:["How does tattoo removal work?","how does the laser get rid of a tattoo","what does the laser actually do to the ink","tattoo laser explained","where does the ink go after its been lasered","hw does tatoo removal work"],on:!0},{key:"tattoo-clinics",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"Clinics offering tattoo removal",answer:"Laser tattoo removal is available at all our clinics.",pricePence:null,phrasings:["Do you do tattoo removal at all your clinics?","tattoo removal near me","which clinics remove tattoos","is tatoo removal availble in newcastle","can I get a tattoo removed at your Leeds clinic","do you do tattoo removal in london"],on:!0},{key:"tattoo-lasers-by-clinic",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"Which tattoo laser each clinic uses",answer:"Laser tattoo removal is available at all our clinics. Our Q10 laser is at Manchester, Leeds and Liverpool, and our PICO laser at Manchester, Newcastle and London.",pricePence:null,phrasings:["Which laser do you use for tattoos?","do you have the pico laser","which clinic has the q10 laser","tattoo laser type","is pico available at the Liverpool clinic","wat machine do you use for tatoo removal"],on:!0},{key:"tattoo-pico-vs-q10",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"PICO and Q10: the difference and the PICO upgrade",answer:"Both are effective tattoo removal lasers. PICO uses ultra-short pulses to break ink into smaller particles, which usually means faster fading and fewer sessions, while Q10 is a proven dual-wavelength laser that treats dark and light inks. In Manchester, you can upgrade from Q10 to PICO for \xA320 per session.",pricePence:null,phrasings:["What's the difference between PICO and Q10?","is pico better than q10","pico vs q10","can i upgrade to pico","is the pico laser quicker at fading tattoos","whats the pico upgrade"],on:!0},{key:"tattoo-sessions-how-many",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"How many tattoo removal sessions",answer:"Amateur tattoos often need 1 to 6 sessions, and professional tattoos 6 to 15. It depends on the tattoo\u2019s age, size, colours, ink depth and where it is on your body.",pricePence:null,phrasings:["How many sessions does tattoo removal take?","how many sessions for a tattoo","tattoo sessions needed","how many goes to get rid of a tattoo","how many treatments does a tatoo need","will my tattoo take loads of sessions"],on:!0},{key:"tattoo-session-interval",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"Time between tattoo removal sessions",answer:"Sessions start at least 6 weeks apart. Later sessions are usually 10 to 12 weeks apart, depending on how the tattoo is fading.",pricePence:null,phrasings:["How long do I wait between tattoo removal sessions?","how often can i come for tattoo removal","gap between tattoo sessions","can i have my tattoo lasered every month","how many weeks inbetween tattoo sessions","how soon can I book my next tattoo removal session"],on:!0},{key:"tattoo-does-it-hurt",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"Does tattoo removal hurt",answer:"Most clients describe it as like a warm elastic band flicking against the skin. We recommend EMLA numbing cream, applied 40 minutes before your appointment, and our cooling system is used throughout and can be adjusted to suit you.",pricePence:null,phrasings:["Does tattoo removal hurt?","is tattoo removal painful","tattoo removal pain","what does tattoo removal feel like","do you use numbing cream for tattoo removal","will getting my tatoo lasered hurt alot"],on:!0},{key:"tattoo-ink-colours",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"Ink colours that can be removed",answer:"Our Q-switched Nd:YAG laser treats dark inks like black and blue, plus lighter inks like red and orange, and our PICO laser is especially good for multi-coloured and layered tattoos. Some colours, particularly certain blues, may only fade partially.",pricePence:null,phrasings:["Can you remove coloured tattoos?","which ink colours are hardest to remove","can you remove red ink","coloured tattoo removal","does the laser work on blue ink","can u get rid of colour tatoos"],on:!0},{key:"tattoo-complete-removal",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"Whether a tattoo can be removed completely",answer:"Complete pigment removal cannot be guaranteed. Certain pigments may fade unevenly, change colour, resist removal or require additional treatments.",pricePence:null,phrasings:["Can you remove a tattoo completely?","will my tattoo be totally gone","do you guarantee full removal of a tattoo","complete tattoo removal","will there be any ink left at the end","will my tatoo dissapear completely"],on:!0},{key:"tattoo-fade-for-cover-up",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"Fading a tattoo for a cover-up",answer:"Yes. Fading first gives your tattoo artist more freedom with the new design, and usually takes fewer sessions than full removal.",pricePence:null,phrasings:["Can you fade my tattoo for a cover-up?","i just want it lightened so i can get it covered","fading for cover up","do I need full removal before a cover up tattoo","my tattooist said to get it lasered before the new design","can you lighten a tatoo for a coverup"],on:!0},{key:"tattoo-session-length",kind:"faq",clinic:null,treatment:"Tattoo removal",title:"How long a tattoo removal session takes",answer:"A session typically lasts between 15 and 30 minutes, depending on the size of your tattoo.",pricePence:null,phrasings:["How long does each tattoo removal session take?","how long is a tattoo removal appointment","tattoo session length","how long will i be in the clinic for my tattoo","is a tattoo removal session quick","how long dose a tatoo session last"],on:!0},{key:"tattoo-after-treatment",kind:"team",clinic:null,treatment:"Tattoo removal",title:"Skin and aftercare after a tattoo removal session",answer:"The area turns white straight away, and this fades within minutes to hours. Redness, bruising or blistering can follow and usually settles within a few days. You'll have an aftercare plan to follow as your tattoo fades between sessions.",pricePence:null,phrasings:["What happens after tattoo removal treatment?","will my tattoo blister after laser","tattoo removal aftercare","is it normal for my tattoo to go white after laser","healing after tattoo removal","will it be red and bruised after my tatoo session"],on:!0},{key:"spmu-eyebrow-how-it-works",kind:"faq",clinic:null,treatment:"SPMU removal",title:"How eyebrow tattoo removal works",answer:"We remove eyebrow tattoos (SPMU) by laser. The laser delivers rapid pulses of energy into the pigment, breaking the ink into smaller particles that your body then naturally processes and removes over time.",pricePence:null,phrasings:["How does eyebrow tattoo removal work?","can you remove microblading","how do you get rid of spmu brows","brow tattoo removal","do you laser off old microbladed brows","how dose spmu removal work"],on:!0},{key:"spmu-sessions-and-spacing",kind:"faq",clinic:null,treatment:"SPMU removal",title:"SPMU removal sessions and spacing",answer:"For most clients, we recommend a course of approximately 2\u20133 treatment sessions, with treatments spaced a minimum of 6 weeks apart. The exact number of sessions can vary, and we'll assess this at your consultation.",pricePence:null,phrasings:["How many sessions to remove my eyebrow tattoo?","how many sessions for spmu removal","how long between brow removal sessions","spmu sessions","how many goes to get microblading off","how far apart are eyeliner removal sesions"],on:!0},{key:"spmu-colour-change",kind:"faq",clinic:null,treatment:"SPMU removal",title:"Colour change and results of SPMU removal",answer:"Certain pigments may fade unevenly, change colour, resist removal or require additional treatments, and complete pigment removal cannot be guaranteed.",pricePence:null,phrasings:["Will my eyebrow tattoo change colour when it's lasered?","can spmu turn a different colour with laser","will my brows go orange after laser","colour change risk","is spmu removal guaranteed to work","wil the brow pigment come out fully"],on:!0},{key:"spmu-eyeliner-removal",kind:"faq",clinic:null,treatment:"SPMU removal",title:"Eyeliner tattoo removal and eye protection",answer:"Our founder Helen personally performs eyeliner tattoo (SPMU) removal. Numbing cream is applied to the eyelids, numbing drops are placed into the eyes, and sterile intraocular shields are positioned over the eyes to protect them from the laser.",pricePence:null,phrasings:["How does eyeliner tattoo removal work?","how do you protect my eyes during eyeliner removal","eye shields","what happens at an eyeliner removal appointment","who does the eyeliner removal","do you numb the eyes for eyeliner tatoo removal"],on:!0},{key:"spmu-eyeliner-clinics",kind:"faq",clinic:null,treatment:"SPMU removal",title:"Clinics offering eyeliner SPMU removal",answer:"Eyeliner SPMU removal is currently only available at our Manchester and London clinics.",pricePence:null,phrasings:["Where can I get eyeliner tattoo removal?","do you do eyeliner removal in London","eyeliner removal clinics","is eyeliner spmu removal available in Leeds","which clinic does the eyeliner tattoo removal","can i get my eyeliner lasered off at liverpool"],on:!0},{key:"spmu-eyebrow-clinics",kind:"faq",clinic:null,treatment:"SPMU removal",title:"Clinics offering eyebrow SPMU removal",answer:"Eyebrow SPMU removal is available at our Manchester, Liverpool, Leeds and Newcastle clinics. It is not available at our London clinic.",pricePence:null,phrasings:["Where can I get eyebrow tattoo removal?","do you do brow removal in London","brow removal clinics","is spmu eyebrow removal available at Newcastle","which of your clinics remove microblading","can i get my brows lasered at harvey nichols"],on:!0},{key:"spmu-retattoo-after-removal",kind:"faq",clinic:null,treatment:"SPMU removal",title:"Having brows tattooed again after removal",answer:"We generally recommend waiting at least 6\u20138 weeks after your final laser removal session before having your eyebrows tattooed again, so the skin can fully heal. Your practitioner will advise you when the skin is ready for new pigment.",pricePence:null,phrasings:["When can I get my brows redone after laser removal?","can I have microblading again after removal","re-tattoo after removal","how long do i wait before getting new spmu brows","can i get my brows done again once you've removed them","how soon can i get my brows re done"],on:!0},{key:"spmu-natural-brow-hair",kind:"faq",clinic:null,treatment:"SPMU removal",title:"Effect on natural eyebrow hair",answer:"The laser is designed to target the pigment in the tattoo ink rather than the hair follicle. Some clients may notice temporary lightening or whitening of the brow hair during treatment, and the natural hair colour typically returns over time as the hair grows through.",pricePence:null,phrasings:["Will the laser remove my eyebrow hair?","will i lose my real brows","does it damage the brow hairs","eyebrow hair","will my eyebrows go white after laser","does spmu removal take ur real eyebrows off"],on:!0},{key:"pigmentation-types-treated",kind:"faq",clinic:null,treatment:"Pigmentation removal",title:"Types of pigmentation treated",answer:"We treat sun spots, age spots and liver spots, freckles, post-inflammatory hyperpigmentation such as dark marks left after acne, caf\xE9 au lait marks, uneven skin tone and sun damage. We treat pigmentation on both the face and the body.",pricePence:null,phrasings:["What pigmentation do you treat?","can you remove sun spots","do you treat age spots and freckles","pigmentation types","can you get rid of dark marks left from acne","do u treat pigmentation on hands","can you laser liver spots"],on:!0},{key:"pigmentation-how-it-works",kind:"faq",clinic:null,treatment:"Pigmentation removal",title:"How laser pigmentation removal works",answer:"The laser targets the excess melanin that causes the marks and breaks it into tiny fragments, leaving the surrounding skin intact. The pigment rises to the surface, then fades and flakes away naturally.",pricePence:null,phrasings:["How does pigmentation removal work?","how does the laser remove dark spots","pigmentation laser explained","what does the laser do to pigmentation","does the laser touch the skin around the dark spot","hw does pigment removal work"],on:!0},{key:"pigmentation-sessions",kind:"faq",clinic:null,treatment:"Pigmentation removal",title:"Pigmentation removal sessions",answer:"Most clients need a course of 2 to 3 sessions, spaced 6 weeks apart. Your consultation will confirm how many you need.",pricePence:null,phrasings:["How many sessions for pigmentation removal?","how many treatments to get rid of sun spots","pigmentation sessions","how far apart are pigmentation sessions","will one session clear my age spots","how many sesions for pigmentation"],on:!0},{key:"pigmentation-after-treatment",kind:"team",clinic:null,treatment:"Pigmentation removal",title:"Skin after pigmentation removal",answer:"Downtime is minimal. Treated areas may feel like mild sunburn for a few hours, with some temporary redness, swelling or sensitivity, and the pigment may darken before it flakes away over 5\u20137 days.",pricePence:null,phrasings:["Is there any downtime after pigmentation removal?","what happens to the spot after laser","pigmentation downtime","will the dark spot get darker before it goes","how long till the pigmentation flakes off","wil my face be red after pigmentation laser"],on:!0},{key:"pigmentation-sun-protection",kind:"team",clinic:null,treatment:"Pigmentation removal",title:"Sun protection around pigmentation removal",answer:"Yes. Avoid direct sun for at least 6 weeks before and 4 weeks after treatment, and use SPF 50 on treated areas every day.",pricePence:null,phrasings:["Do I need to stay out of the sun after pigmentation removal?","pigmentation removal and sun exposure","sun after pigmentation laser","do I need to wear SPF after treatment for sun spots","how long before pigmentation laser should i avoid the sun","can i sunbathe after pigment removal"],on:!0},{key:"pigmentation-aftercare",kind:"team",clinic:null,treatment:"Pigmentation removal",title:"Aftercare for pigmentation removal",answer:"Avoid hot baths, saunas, strenuous exercise and massage for 2\u20135 days. Wait until any redness or swelling has settled before wearing make-up, and don't pick at the darkened pigment while it flakes.",pricePence:null,phrasings:["What aftercare is there for pigmentation removal?","can i wear makeup after pigmentation laser","pigmentation aftercare","can I go to the gym after pigmentation treatment","what should i avoid after having sun spots lasered","can i pick the flaky bits off after pigmentation laser"],on:!0},{key:"pigmentation-clinics",kind:"faq",clinic:null,treatment:"Pigmentation removal",title:"Clinics offering pigmentation removal",answer:"Laser pigmentation removal is available at all our clinics: Manchester, Leeds, Liverpool, Newcastle and London.",pricePence:null,phrasings:["Which clinics do pigmentation removal?","do you do pigmentation removal in Leeds","pigmentation removal near me","is pigmentation treatment available at all your clinics","can i get sun spots treated at the London clinic","wich clinic does pigmentation"],on:!0},{key:"pigmentation-does-it-hurt",kind:"faq",clinic:null,treatment:"Pigmentation removal",title:"Does pigmentation removal hurt",answer:"Most clients find it very comfortable, describing it as a quick warm snap on the skin. There's no need for numbing cream.",pricePence:null,phrasings:["Does pigmentation removal hurt?","is pigmentation laser painful","pigmentation pain","do I need numbing cream for pigmentation removal","what does the pigmentation laser feel like","dose it hurt getting sun spots removed"],on:!0},{key:"veins-what-we-treat",kind:"faq",clinic:null,treatment:"Thread vein removal",title:"Thread veins: what we can treat",answer:"We treat thread veins, also known as spider veins, which can appear on the legs, face and other parts of the body. We are only able to treat thread veins: larger veins, such as varicose veins, cannot be removed with this treatment.",pricePence:null,phrasings:["Do you treat thread veins?","spider vein removal","can you get rid of the little red veins on legs","do u do thread veins on the face","Can you treat varicose veins?","is broken veins on the cheeks something you treat","red viens removal"],on:!0},{key:"veins-how-it-works",kind:"faq",clinic:null,treatment:"Thread vein removal",title:"Thread veins: how the laser works",answer:"We use the Primelase Excellence laser for thread vein removal. During the treatment, the laser energy is absorbed by the blood vessels in the veins, causing them to collapse and be naturally reabsorbed by the body.",pricePence:null,phrasings:["How does thread vein removal work?","how does the laser get rid of veins","what laser do you use for thread veins","thread vein laser explained","what actualy happens to the vein","which machine is used for spider veins"],on:!0},{key:"veins-sessions",kind:"faq",clinic:null,treatment:"Thread vein removal",title:"Thread veins: how many sessions",answer:"The number of sessions varies depending on the size and severity of the veins, but most clients see significant results within 1 to 3 treatments. Many cherry angiomas can be removed in just one session, but some may require a follow-up treatment.",pricePence:null,phrasings:["How many sessions for thread veins?","thread vein sessions","will one session be enough for spider veins","how many treatments do cherry angiomas need","how many goes to get rid of thred veins","do I need a course for thread veins or just one"],on:!0},{key:"veins-pain",kind:"faq",clinic:null,treatment:"Thread vein removal",title:"Thread veins: does it hurt",answer:"Most clients only experience a mild discomfort, often described as a quick snapping sensation, similar to an elastic band on the skin.",pricePence:null,phrasings:["Does thread vein removal hurt?","is thread vein laser painful","thread veins pain","does it hurt getting spider veins lasered","whats the pain like for thread vein removal","will lasering veins sting"],on:!0},{key:"veins-after-treatment",kind:"team",clinic:null,treatment:"Thread vein removal",title:"Thread veins: after your treatment",answer:"After treatment there's usually no need for recovery time. Some swelling, redness or mild bruising may occur but typically subsides within a few days. Avoid hot baths, saunas or intense exercise for 24-48 hours and make-up or perfumed products for 24 hours, and keep the skin well moisturised.",pricePence:null,phrasings:["What's the aftercare for thread vein removal?","thread vein aftercare","will I be red or bruised after thread vein laser","can i go the gym after thread veins","side effects of thread vein removal?","is there any downtime after spider vein treatment","can I wear makeup after thred vein removal"],on:!0},{key:"veins-sun-exposure",kind:"team",clinic:null,treatment:"Thread vein removal",title:"Thread veins: sun exposure before and after",answer:"Please avo
